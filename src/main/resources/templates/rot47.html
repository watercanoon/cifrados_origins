<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROT47 - Cifrado en Tiempo Real</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.5.1/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>

    <style>
        body {
            background: radial-gradient(circle at top, #0f172a, #020617);
        }
    </style>
</head>

<body class="text-slate-200 min-h-screen">

<!-- HEADER -->
<div class="max-w-6xl mx-auto px-6 py-8">

    <div class="flex justify-between items-center mb-8">

        <div>
            <h1 class="text-4xl font-bold">
                🔐 ROT47
            </h1>
            <p class="text-slate-400">
                Cifrado ASCII en tiempo real con WebSocket
            </p>
        </div>

        <div class="flex items-center gap-2 bg-slate-900 px-4 py-2 rounded-full border border-slate-700">
            <span id="ws-status" class="w-3 h-3 bg-red-500 rounded-full animate-pulse"></span>
            <span class="text-sm">STOMP</span>
        </div>

    </div>

    <!-- GRID -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">

        <!-- PANEL IZQUIERDO -->
        <div class="bg-slate-900/80 backdrop-blur p-6 rounded-2xl border border-slate-700 shadow-xl">

            <h2 class="text-lg font-semibold mb-4 text-white">⚙ Configuración</h2>

            <button id="btnCifrar"
                    class="w-full bg-blue-600 hover:bg-blue-500 transition py-2 rounded-lg font-semibold mb-3">
                🔒 Cifrar
            </button>

            <button id="btnDescifrar"
                    class="w-full bg-slate-700 hover:bg-slate-600 transition py-2 rounded-lg font-semibold">
                🔓 Descifrar
            </button>

            <div class="mt-6 text-sm text-slate-400">
                <p>✔ Tiempo real</p>
                <p>✔ WebSockets</p>
                <p>✔ ASCII Shift 47</p>
            </div>

        </div>

        <!-- INPUT -->
        <div class="md:col-span-2 space-y-4">

            <div class="bg-slate-900/80 backdrop-blur p-5 rounded-2xl border border-slate-700 shadow-lg">
                <label class="text-slate-400 text-sm">Texto de entrada</label>

                <textarea id="textoInput"
                          class="w-full mt-2 bg-slate-950 p-3 rounded-lg border border-slate-700 focus:border-blue-500 outline-none"
                          rows="6"
                          placeholder="Escribe tu mensaje aquí..."></textarea>
            </div>

            <div class="bg-gradient-to-r from-emerald-950/40 to-blue-950/40 p-5 rounded-2xl border border-emerald-800 shadow-lg">
                <label class="text-emerald-300 text-sm">Resultado</label>

                <textarea id="textoOutput"
                          class="w-full mt-2 bg-slate-950 p-3 rounded-lg border border-emerald-700 text-emerald-200 font-mono"
                          rows="6"
                          readonly
                          placeholder="El resultado aparecerá aquí..."></textarea>
            </div>

        </div>

    </div>

</div>

<script src="/js/rot47.js"></script>

</body>
</html>
