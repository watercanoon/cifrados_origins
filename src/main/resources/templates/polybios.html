<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cifrado Polybios - Cifrados Origin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" th:href="@{/css/global.css}">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔐</text></svg>">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.5.1/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-200 min-h-screen font-sans">
<div class="container mx-auto px-4 py-8 max-w-5xl">
    <a th:href="@{/}" class="text-blue-400 mb-6 inline-block hover:text-blue-300">← Volver al Menú</a>

    <header class="mb-10 border-b border-slate-700 pb-4 flex justify-between items-center">
        <div>
            <h1 class="text-3xl font-bold text-white">Cifrado de Polybios</h1>
            <p class="text-slate-400">Sustitución por coordenadas matriciales (5x5)</p>
        </div>
        <div class="flex items-center space-x-2 bg-slate-800 py-2 px-4 rounded-full border border-slate-700">
            <span id="ws-status" class="w-3 h-3 bg-red-500 rounded-full animate-pulse"></span>
            <span class="text-sm font-medium text-slate-300">Conexión STOMP</span>
        </div>
    </header>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
        <div class="bg-slate-800 p-6 rounded-xl border border-slate-700 h-fit">
            <h2 class="text-xl font-semibold mb-4 text-white">Parámetros</h2>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-400 mb-1">Idioma (Regla de la Ñ)</label>
                    <select id="idiomaSelect" class="w-full bg-slate-900 border border-slate-600 rounded-lg p-2.5 text-white outline-none">
                        <option value="ES">Español (I/J y N/Ñ unidas)</option>
                        <option value="EN">Inglés (Solo I/J unidas)</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-400 mb-1">Operación</label>
                    <div class="flex rounded-md shadow-sm" role="group">
                        <button type="button" id="btnCifrar" class="flex-1 px-4 py-2 text-sm font-medium text-white bg-blue-600 border border-blue-600 rounded-l-lg">Cifrar</button>
                        <button type="button" id="btnDescifrar" class="flex-1 px-4 py-2 text-sm font-medium text-slate-300 bg-slate-700 border border-slate-600 rounded-r-lg">Descifrar</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="md:col-span-2 space-y-6">
            <div class="bg-slate-800 p-6 rounded-xl border border-slate-700">
                <label class="block text-sm text-slate-400 mb-2 uppercase">Texto de Entrada</label>
                <textarea id="textoInput" rows="4" class="w-full bg-slate-900 border border-slate-600 rounded-lg p-3 text-white outline-none resize-none" placeholder="Escribe aquí..."></textarea>
            </div>
            <div class="bg-blue-900/20 p-6 rounded-xl border border-blue-800/40">
                <label class="block text-sm text-blue-400 mb-2 uppercase">Texto Resultante</label>
                <textarea id="textoOutput" rows="4" class="w-full bg-slate-900/50 border border-blue-700/50 rounded-lg p-3 text-blue-100 resize-none font-mono text-lg outline-none" readonly></textarea>
            </div>
        </div>
    </div>
</div>
<script th:src="@{/js/polybios.js}"></script>
</body>
</html>
