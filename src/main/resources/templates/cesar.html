<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cifrado César - Cifrados Origin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" th:href="@{/css/global.css}">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.5.1/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-200 min-h-screen font-sans">

<div class="container mx-auto px-4 py-8 max-w-5xl">
    <a th:href="@{/}" class="inline-flex items-center text-blue-400 hover:text-blue-300 transition-colors mb-6">
        <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
        Volver al Menú
    </a>

    <header class="mb-10 flex items-center justify-between border-b border-slate-700 pb-4">
        <div>
            <h1 class="text-3xl font-bold text-white tracking-tight">Cifrado de César</h1>
            <p class="text-slate-400 mt-1">Tiempo real via WebSockets</p>
        </div>
        <div class="flex items-center space-x-2 bg-slate-800 py-2 px-4 rounded-full border border-slate-700">
            <span id="ws-status" class="w-3 h-3 bg-red-500 rounded-full animate-pulse" title="Desconectado"></span>
            <span class="text-sm font-medium text-slate-300">Conexión STOMP</span>
        </div>
    </header>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
        <div class="bg-slate-800 p-6 rounded-xl shadow-lg border border-slate-700 h-fit">
            <h2 class="text-xl font-semibold mb-4 text-white border-b border-slate-700 pb-2">Parámetros</h2>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-400 mb-1">Alfabeto</label>
                    <select id="idiomaSelect" class="w-full bg-slate-900 border border-slate-600 rounded-lg p-2.5 text-white focus:ring-blue-500 focus:border-blue-500 outline-none">
                        <option value="ES">Español (27 letras)</option>
                        <option value="EN">Inglés (26 letras)</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-400 mb-1">Desplazamiento (Clave)</label>
                    <input type="number" id="claveInput" value="3" class="w-full bg-slate-900 border border-slate-600 rounded-lg p-2.5 text-white focus:ring-blue-500 focus:border-blue-500 outline-none">
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-400 mb-1">Operación</label>
                    <div class="flex rounded-md shadow-sm" role="group">
                        <button type="button" id="btnCifrar" class="flex-1 px-4 py-2 text-sm font-medium text-white bg-blue-600 border border-blue-600 rounded-l-lg transition-colors">Cifrar</button>
                        <button type="button" id="btnDescifrar" class="flex-1 px-4 py-2 text-sm font-medium text-slate-300 bg-slate-700 border border-slate-600 rounded-r-lg hover:bg-slate-600 transition-colors">Descifrar</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="md:col-span-2 space-y-6">
            <div class="bg-slate-800 p-6 rounded-xl shadow-lg border border-slate-700">
                <label class="block text-sm font-medium text-slate-400 mb-2 uppercase tracking-wider">Texto de Entrada</label>
                <textarea id="textoInput" rows="4" class="w-full bg-slate-900 border border-slate-600 rounded-lg p-3 text-white focus:ring-blue-500 focus:border-blue-500 transition-colors resize-none outline-none" placeholder="Escribe aquí..."></textarea>
            </div>

            <div class="bg-blue-900/20 p-6 rounded-xl shadow-lg border border-blue-800/40">
                <label class="block text-sm font-medium text-blue-400 mb-2 uppercase tracking-wider">Texto Resultante</label>
                <textarea id="textoOutput" rows="4" class="w-full bg-slate-900/50 border border-blue-700/50 rounded-lg p-3 text-blue-100 resize-none font-mono text-lg outline-none" readonly placeholder="Esperando datos..."></textarea>
            </div>
        </div>
    </div>
</div>

<script th:src="@{/js/cesar.js}"></script>
</body>
</html>
