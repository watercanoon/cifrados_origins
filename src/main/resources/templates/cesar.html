<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cifrado Cesar - Profesional</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.5.1/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    <link rel="stylesheet" th:href="@{/css/global.css}">
    <style>
        body { background-color: #0f172a; color: #f8fafc; }
        .glass-panel { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8 font-sans antialiased">

<div id="toast-container" class="fixed top-5 right-5 z-50 flex flex-col gap-2"></div>

<div class="max-w-7xl mx-auto">
    <header class="mb-8 flex items-center justify-between">
        <div>
            <h1 class="text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-emerald-400">Cifrado Cesar</h1>
            <p class="text-slate-400 text-sm mt-1">Sustitucion monoalfabetica interactiva</p>
        </div>
        <a th:href="@{/}" class="px-4 py-2 text-sm font-semibold text-slate-300 bg-slate-800 rounded-lg hover:bg-slate-700 transition">Volver al Inicio</a>
    </header>

    <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
        <div class="lg:col-span-4 glass-panel rounded-2xl p-6 h-fit">
            <h2 class="text-lg font-bold text-white mb-6 border-b border-slate-700 pb-2">Parametros</h2>

            <form id="cesarForm" class="space-y-6">
                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Alfabeto</label>
                    <select id="idioma" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2.5 text-sm text-white focus:ring-2 focus:ring-blue-500 outline-none transition">
                        <option value="ES">Espanol (Incluye Ñ)</option>
                        <option value="EN">Ingles (Sin Ñ)</option>
                        <option value="CUSTOM">Personalizado...</option>
                    </select>
                </div>

                <div id="customAlphabetContainer" class="hidden animate-fade-in">
                    <label class="block text-xs font-semibold text-emerald-400 uppercase tracking-wider mb-2">Crea tu Alfabeto</label>
                    <input type="text" id="alfabetoCustom" placeholder="Ej: QWERTYUIOPASDFGHJKLZXCVBNM" class="w-full bg-slate-900 border border-emerald-500/50 rounded-lg px-4 py-2.5 text-sm text-white placeholder-slate-600 focus:ring-2 focus:ring-emerald-500 outline-none uppercase transition">
                    <p class="text-[10px] text-slate-500 mt-1">Ingresa caracteres unicos sin espacios.</p>
                </div>

                <div>
                    <div class="flex justify-between mb-2">
                        <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider">Desplazamiento (Clave)</label>
                        <span id="claveValueDisplay" class="text-xs font-bold text-blue-400 bg-blue-900/30 px-2 rounded">3</span>
                    </div>
                    <input type="range" id="clave" min="1" max="50" value="3" class="w-full h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-blue-500">
                </div>
            </form>

            <div class="mt-6 p-4 bg-slate-950/60 border border-slate-700 rounded-xl">
                <h3 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-3">Alfabetos</h3>
                <div class="space-y-3">
                    <div>
                        <div class="text-[10px] text-slate-500 uppercase font-bold mb-1">Alfabeto base</div>
                        <div id="alfabetoBaseDisplay" class="w-full min-h-10 bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs md:text-sm text-slate-200 font-mono break-all leading-relaxed"></div>
                    </div>
                    <div>
                        <div class="text-[10px] text-blue-400 uppercase font-bold mb-1">Alfabeto cifrado</div>
                        <div id="alfabetoCifradoDisplay" class="w-full min-h-10 bg-blue-950/40 border border-blue-500/30 rounded-lg px-3 py-2 text-xs md:text-sm text-blue-200 font-mono break-all leading-relaxed"></div>
                    </div>
                </div>
            </div>

            <div class="mt-8 p-4 bg-blue-500/10 border border-blue-500/20 rounded-lg">
                <h3 class="text-blue-400 font-bold text-sm mb-2 flex items-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    Como funciona
                </h3>
                <p class="text-xs text-slate-400 leading-relaxed">
                    Escribe en Texto Original para cifrar. Escribe en Texto Cifrado para descifrar con la misma clave y alfabeto.
                </p>
            </div>
        </div>

        <div class="lg:col-span-8 flex flex-col gap-6">
            <div class="glass-panel rounded-2xl p-6 flex-1 flex flex-col relative group">
                <div class="absolute inset-0 bg-gradient-to-r from-blue-500/10 to-transparent opacity-0 group-focus-within:opacity-100 rounded-2xl transition-opacity pointer-events-none"></div>
                <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 mb-3 w-full relative z-10">
                    <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider">Texto Original</label>
                    <div class="flex gap-2 w-full sm:w-auto">
                        <button id="btnPegar" type="button" class="flex-1 sm:flex-none justify-center text-xs bg-slate-800 hover:bg-cyan-500/20 text-slate-300 hover:text-cyan-400 border border-transparent hover:border-cyan-500/30 px-3 py-1.5 rounded flex items-center gap-2 transition cursor-pointer">
                            Pegar
                        </button>
                        <button id="btnLimpiar" type="button" class="flex-1 sm:flex-none justify-center text-xs bg-slate-800 hover:bg-red-500/20 text-slate-300 hover:text-red-400 border border-transparent hover:border-red-500/30 px-3 py-1.5 rounded flex items-center gap-2 transition cursor-pointer">
                            Limpiar
                        </button>
                    </div>
                </div>
                <textarea id="textoEntrada" placeholder="Escribe texto normal para cifrarlo..." class="w-full flex-1 bg-transparent border-none text-white text-lg placeholder-slate-600 resize-none focus:ring-0 outline-none custom-scrollbar"></textarea>
            </div>

            <div class="glass-panel rounded-2xl p-6 flex-1 flex flex-col border-emerald-500/20 relative group">
                <div class="absolute inset-0 bg-gradient-to-r from-emerald-500/10 to-transparent opacity-0 group-focus-within:opacity-100 rounded-2xl transition-opacity pointer-events-none"></div>
                <div class="flex justify-between items-center mb-3 relative z-10">
                    <label class="block text-xs font-semibold text-emerald-400 uppercase tracking-wider">Texto Cifrado</label>
                    <button id="btnCopiar" type="button" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded flex items-center gap-2 transition">
                        Copiar
                    </button>
                </div>
                <textarea id="textoSalida" placeholder="Escribe texto cifrado para descifrarlo..." class="w-full flex-1 bg-transparent border-none text-emerald-300 text-lg font-mono resize-none outline-none custom-scrollbar"></textarea>
            </div>
        </div>
    </div>
</div>

<script th:src="@{/js/cesar.js}"></script>
</body>
</html>
