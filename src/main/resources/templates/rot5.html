<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cifrado ROT5 - Cifrados Origin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" th:href="@{/css/global.css}">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.5.1/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-200 min-h-screen font-sans">

<div class="container mx-auto px-4 py-8 max-w-5xl">
    <a th:href="@{/}" class="inline-flex items-center text-cyan-400 hover:text-cyan-300 transition-colors mb-6">
        <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
        Volver al Menu
    </a>

    <header class="mb-10 border-b border-slate-700 pb-4 flex flex-col sm:flex-row sm:justify-between sm:items-center gap-4">
        <div>
            <h1 class="text-3xl font-bold text-white tracking-tight">Cifrado ROT5</h1>
            <p class="text-slate-400 mt-1">Rotacion de 5 posiciones para digitos del 0 al 9 via WebSockets</p>
        </div>
        <div class="flex items-center space-x-2 bg-slate-800 py-2 px-4 rounded-full border border-slate-700 w-fit">
            <span id="ws-status" class="w-3 h-3 bg-red-500 rounded-full animate-pulse" title="Desconectado"></span>
            <span class="text-sm font-medium text-slate-300">Conexion STOMP</span>
        </div>
    </header>

    <section class="mb-6 bg-slate-800 border border-slate-700 rounded-xl p-4 shadow-lg">
        <div class="flex flex-col gap-2">
            <span class="text-xs font-semibold uppercase tracking-wider text-cyan-400">Alfabeto activo</span>
            <div id="alfabetoDisplay" class="font-mono text-sm md:text-base text-slate-100 break-all bg-slate-900 border border-slate-700 rounded-lg p-3">0123456789</div>
        </div>
    </section>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
        <div class="bg-slate-800 p-6 rounded-xl shadow-lg border border-slate-700 h-fit">
            <h2 class="text-xl font-semibold mb-4 text-white border-b border-slate-700 pb-2">Parametros</h2>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-400 mb-1">Desplazamiento</label>
                    <div class="w-full bg-slate-900 border border-slate-600 rounded-lg p-2.5 text-slate-300">5 posiciones</div>
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-400 mb-1">Alcance</label>
                    <div class="w-full bg-slate-900 border border-slate-600 rounded-lg p-2.5 text-slate-300">Solo numeros</div>
                </div>
            </div>
        </div>

        <div class="md:col-span-2 space-y-6">
            <div class="bg-slate-800 p-6 rounded-xl shadow-lg border border-slate-700">
                <label class="block text-sm font-medium text-slate-400 mb-2 uppercase tracking-wider">Texto de Entrada</label>
                <textarea id="textoInput" rows="4" inputmode="numeric" pattern="[0-9]*" class="w-full bg-slate-900 border border-slate-600 rounded-lg p-3 text-white focus:ring-cyan-500 focus:border-cyan-500 transition-colors resize-none outline-none" placeholder="Ejemplo: 0123456789"></textarea>
            </div>

            <div class="bg-cyan-900/20 p-6 rounded-xl shadow-lg border border-cyan-800/40">
                <label class="block text-sm font-medium text-cyan-400 mb-2 uppercase tracking-wider">Texto Resultante</label>
                <textarea id="textoOutput" rows="4" class="w-full bg-slate-900/50 border border-cyan-700/50 rounded-lg p-3 text-cyan-100 resize-none font-mono text-lg outline-none" readonly placeholder="Esperando datos..."></textarea>
            </div>
        </div>
    </div>
</div>

<script th:src="@{/js/rot5.js}"></script>
</body>
</html>
