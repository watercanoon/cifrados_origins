<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATBASH - Cifrados Origin</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.5.1/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
</head>

<body class="bg-slate-950 text-slate-200 min-h-screen font-sans">

<div class="max-w-6xl mx-auto px-6 py-8">

    <!-- BACK -->
    <a href="/" class="text-blue-400 hover:text-blue-300 transition">
        ← Volver al Menu
    </a>

    <!-- TITLE -->
    <div class="mt-4 mb-8">
        <h1 class="text-4xl font-bold text-white">
            Cifrado <span class="text-purple-400">ATBASH</span>
        </h1>
        <p class="text-slate-400 mt-1">
            Sustitución inversa del alfabeto en tiempo real
        </p>
    </div>

    <!-- GRID -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">

        <!-- SIDEBAR -->
        <div class="bg-slate-900 border border-slate-700 rounded-xl p-6 h-fit">

            <h2 class="text-xl font-semibold mb-4 border-b border-slate-700 pb-2">
                Parámetros
            </h2>

            <!-- ALFABETO -->
            <div class="mb-4">
                <label class="text-sm text-slate-400">Alfabeto</label>

                <select id="idiomaSelect"
                        class="w-full mt-2 p-2 bg-slate-950 border border-slate-700 rounded-lg text-white">
                    <option value="ES">Español (27 letras)</option>
                    <option value="EN">Inglés (26 letras)</option>
                </select>
            </div>

            <!-- BOTONES CIFRAR / DESCIFRAR -->
            <div class="mb-4">
                <label class="text-sm text-slate-400">Operación</label>

                <div class="flex mt-2 rounded-lg overflow-hidden border border-slate-700">

                    <button id="btnCifrar"
                            class="flex-1 py-2 bg-blue-600 text-white font-medium">
                        Cifrar
                    </button>

                    <button id="btnDescifrar"
                            class="flex-1 py-2 bg-slate-800 text-slate-300 hover:bg-slate-700">
                        Descifrar
                    </button>

                </div>
            </div>

            <!-- INFO -->
            <div class="space-y-2 text-xs text-slate-400 mt-4">
                <p class="bg-purple-500/10 border border-purple-500/20 p-2 rounded">
                    🌎 Alfabeto latinoamericano
                </p>
                <p class="bg-blue-500/10 border border-blue-500/20 p-2 rounded">
                    🇺🇸 Alfabeto americano
                </p>
            </div>

            <!-- STATUS -->
            <div class="mt-6 flex items-center gap-2">
                <span id="ws-status" class="w-3 h-3 bg-red-500 rounded-full animate-pulse"></span>
                <span class="text-sm text-slate-400">STOMP</span>
            </div>

        </div>

        <!-- MAIN -->
        <div class="md:col-span-2 space-y-6">

            <!-- INPUT -->
            <div class="bg-slate-900 border border-slate-700 rounded-xl p-6">
                <label class="text-sm text-slate-400">Texto de entrada</label>
                <textarea id="textoInput"
                          rows="5"
                          class="w-full mt-2 p-3 bg-slate-950 border border-slate-700 rounded-lg text-white"
                          placeholder="Escribe aquí..."></textarea>
            </div>

            <!-- OUTPUT -->
            <div class="bg-purple-950/20 border border-purple-700 rounded-xl p-6">
                <label class="text-sm text-slate-400">Resultado</label>
                <textarea id="textoOutput"
                          rows="5"
                          readonly
                          class="w-full mt-2 p-3 bg-slate-950 border border-purple-700 rounded-lg text-purple-200 font-mono text-lg"
                          placeholder="Resultado..."></textarea>
            </div>

        </div>

    </div>

</div>

<script src="/js/atbash.js"></script>

</body>
</html>
