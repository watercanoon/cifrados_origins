<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cifrado Escítala - Cifrados Origin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" th:href="@{/css/global.css}">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.5.1/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-200 min-h-screen font-sans">

<div class="container mx-auto px-4 py-8 max-w-5xl">
    <a th:href="@{/}" class="inline-flex items-center text-blue-400 hover:text-blue-300 transition-colors mb-6">
        <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
        Volver al Menú
    </a>

    <header class="mb-10 flex items-center justify-between border-b border-slate-700 pb-4">
        <div>
            <h1 class="text-3xl font-bold text-white tracking-tight">Cifrado Escítala</h1>
            <p class="text-slate-400 mt-1">Transposición espartana interactiva via WebSockets</p>
        </div>
        <div class="flex items-center space-x-2 bg-slate-800 py-2 px-4 rounded-full border border-slate-700 shadow-inner">
            <span id="ws-status" class="w-3 h-3 bg-red-500 rounded-full animate-pulse shadow-[0_0_8px_rgba(239,68,68,0.8)]"></span>
            <span class="text-sm font-medium text-slate-300">Conexión STOMP</span>
        </div>
    </header>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
        <div class="bg-slate-800 p-6 rounded-xl shadow-xl border border-slate-700 h-fit">
            <h2 class="text-xl font-semibold mb-6 text-white border-b border-slate-700 pb-2">Configuración</h2>
            <div class="space-y-6">
                <div>
                    <label class="block text-sm font-medium text-slate-400 mb-2">Caras del Bastón (Clave)</label>
                    <input type="number" id="claveInput" value="4" min="2" class="w-full bg-slate-900 border border-slate-600 rounded-lg p-3 text-white font-bold focus:ring-blue-500 focus:border-blue-500 outline-none transition-all shadow-inner">
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-400 mb-2">Modo de Operación</label>
                    <div class="flex items-center justify-between bg-slate-900 border border-slate-600 rounded-lg p-3 shadow-inner">
                        <span id="lblCifrar" class="text-sm font-bold text-blue-400 transition-colors">Cifrar</span>
                        <label class="relative inline-flex items-center cursor-pointer mx-2">
                            <input type="checkbox" id="toggleModo" class="sr-only peer">
                            <div class="w-12 h-6 bg-blue-600 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-emerald-600 shadow-inner"></div>
                        </label>
                        <span id="lblDescifrar" class="text-sm font-medium text-slate-500 transition-colors">Descifrar</span>
                    </div>
                </div>

                <div class="pt-2">
                    <button type="button" id="btnProcesar" class="w-full bg-gradient-to-r from-blue-600 to-cyan-600 hover:from-blue-500 hover:to-cyan-500 text-white font-bold py-3.5 px-4 rounded-xl shadow-lg active:scale-[0.98] transition-all flex justify-center items-center gap-2 cursor-pointer">
                        <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M11.3 1.046A1 1 0 0112 2v5h4a1 1 0 01.82 1.573l-7 10A1 1 0 018 18v-5H4a1 1 0 01-.82-1.573l7-10a1 1 0 011.12-.38z" clip-rule="evenodd"></path></svg>
                        Procesar Transposición
                    </button>
                </div>
            </div>
        </div>

        <div class="md:col-span-2 space-y-6">
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div class="bg-slate-800 p-5 rounded-xl shadow-lg border border-slate-700" id="panelInput">
                    <label id="tituloInput" class="block text-xs font-bold text-blue-400 mb-2 uppercase tracking-wider">Texto Plano (Entrada)</label>
                    <textarea id="textoInput" rows="3" class="w-full bg-slate-900 border border-slate-600 rounded-lg p-3 text-white focus:ring-blue-500 focus:border-blue-500 transition-colors resize-none outline-none shadow-inner" placeholder="Escribe tu mensaje..."></textarea>
                </div>

                <div class="bg-slate-800/50 p-5 rounded-xl shadow-lg border border-slate-700/50" id="panelOutput">
                    <label id="tituloOutput" class="block text-xs font-bold text-emerald-400 mb-2 uppercase tracking-wider">Texto Cifrado (Resultado)</label>
                    <textarea id="textoOutput" rows="3" class="w-full bg-slate-900/50 border border-slate-700 rounded-lg p-3 text-emerald-100 resize-none font-mono text-lg outline-none shadow-inner" readonly placeholder="Esperando datos..."></textarea>
                </div>
            </div>

            <div id="panelMatriz" class="bg-slate-800 p-6 rounded-xl shadow-xl border border-slate-700">
                <div class="flex justify-between items-center mb-5">
                    <label class="block text-sm font-bold text-amber-500 uppercase tracking-wider">🪵 Bastón de Mando Espartano</label>

                    <button id="btnAutoGiro" class="flex items-center gap-2 bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold py-1.5 px-3 rounded-lg shadow transition-colors active:scale-95 cursor-pointer">
                        <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" clip-rule="evenodd"></path></svg>
                        Auto-Giro
                    </button>
                </div>

                <div class="flex items-center justify-center py-4 bg-slate-950/40 rounded-2xl border border-slate-800/60 p-4">
                    <div class="w-6 h-16 bg-gradient-to-b from-[#201207] via-[#422714] to-[#170c04] border-y-2 border-l-2 border-[#120903] rounded-l-xl shadow-2xl shrink-0 z-20"></div>

                    <div class="relative w-full h-24 bg-gradient-to-b from-[#3a2210] via-[#633e1f] to-[#261509] border-y-2 border-[#1c0f06] overflow-hidden flex justify-center shadow-[inset_0_8px_20px_rgba(0,0,0,0.95),0_8px_16px_rgba(0,0,0,0.4)] z-10">
                        <div class="absolute inset-0 bg-[linear-gradient(90deg,rgba(0,0,0,0.25)_1px,transparent_2px)] bg-[size:16px_100%] opacity-40"></div>
                        <div id="cintaBaston" class="absolute top-0 left-0 w-full flex flex-col transition-transform duration-300 ease-in-out">
                        </div>
                    </div>

                    <div class="w-6 h-16 bg-gradient-to-b from-[#201207] via-[#422714] to-[#170c04] border-y-2 border-r-2 border-[#120903] rounded-r-xl shadow-2xl shrink-0 z-20"></div>

                    <div class="flex flex-col gap-1.5 ml-4 shrink-0 z-20">
                        <button id="btnArriba" class="bg-slate-700 hover:bg-slate-600 text-slate-200 p-2.5 rounded-t-xl border border-slate-600 active:bg-slate-500 shadow-md transition cursor-pointer hover:text-amber-400">
                            <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M14.707 12.707a1 1 0 01-1.414 0L10 9.414l-3.293 3.293a1 1 0 01-1.414-1.414l4-4a1 1 0 011.414 0l4 4a1 1 0 010 1.414z" clip-rule="evenodd"></path></svg>
                        </button>
                        <button id="btnAbajo" class="bg-slate-700 hover:bg-slate-600 text-slate-200 p-2.5 rounded-b-xl border border-slate-600 active:bg-slate-500 shadow-md transition cursor-pointer hover:text-amber-400">
                            <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd"></path></svg>
                        </button>
                    </div>
                </div>

                <div class="grid grid-cols-2 sm:grid-cols-4 gap-4 mt-5 pt-4 border-t border-slate-700/60 text-center">
                    <div class="bg-slate-900/40 p-2.5 rounded-xl border border-slate-800">
                        <span class="block text-[10px] text-slate-400 font-bold uppercase tracking-widest">Caracteres</span>
                        <span id="statLongitud" class="text-base font-black text-blue-400">0</span>
                    </div>
                    <div class="bg-slate-900/40 p-2.5 rounded-xl border border-slate-800">
                        <span class="block text-[10px] text-slate-400 font-bold uppercase tracking-widest">Vueltas Tira</span>
                        <span id="statVueltas" class="text-base font-black text-amber-500">0</span>
                    </div>
                    <div class="bg-slate-900/40 p-2.5 rounded-xl border border-slate-800">
                        <span class="block text-[10px] text-slate-400 font-bold uppercase tracking-widest">Secciones</span>
                        <span id="statSecciones" class="text-base font-black text-purple-400">0</span>
                    </div>
                    <div class="bg-slate-900/40 p-2.5 rounded-xl border border-slate-800">
                        <span class="block text-[10px] text-slate-400 font-bold uppercase tracking-widest">Relleno (X)</span>
                        <span id="statRelleno" class="text-base font-black text-red-400">0</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script th:src="@{/js/escitala.js}"></script>
</body>
</html>
